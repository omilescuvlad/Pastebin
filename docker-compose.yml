services:
  app:
    build: .
    container_name: pastebin-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: admin
      DATABASE_NAME: pastebin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      APP_URL: ${APP_URL}
      ROLES_KEY: roles
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: pastebin-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pastebin
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: