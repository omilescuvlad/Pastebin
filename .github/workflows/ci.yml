name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test NestJS app
    runs-on: ubuntu-latest

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASS: ${{ secrets.CI_DATABASE_PASS }}
      DATABASE_NAME: pastebin
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ROLES_KEY: roles

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DATABASE_PASS }}
          POSTGRES_DB: pastebin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pastebin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build project
        run: npm run build