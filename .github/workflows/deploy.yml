name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  REPO_NAME: pastebin-repo
  IMAGE_NAME: pastebin-app
  SERVICE_NAME: pastebin-server
  INSTANCE_CONNECTION_NAME: ${{ secrets.INSTANCE_CONNECTION_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        docker build --platform linux/amd64 -t europe-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA .
        docker push europe-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image=europe-west3-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA \
          --region=$REGION \
          --add-cloudsql-instances=$INSTANCE_CONNECTION_NAME \
          --update-env-vars DATABASE_USER=${{ secrets.DATABASE_USER }},DATABASE_PASS=${{ secrets.DATABASE_PASS }},DATABASE_NAME=pastebin,DATABASE_HOST=/cloudsql/$INSTANCE_CONNECTION_NAME \
          --allow-unauthenticated \
          --quiet