name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - production

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  REPO_NAME: pastebin-repo
  IMAGE_NAME: pastebin-app

jobs:
  build-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            $REGION-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA \
            .

      - name: Push Docker image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA

  deploy-qa:
    name: Deploy QA
    needs: build-image
    runs-on: ubuntu-latest
    environment: qa

    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'qa' ||
      github.event.inputs.target == 'production'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy QA
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --add-cloudsql-instances="${{ secrets.INSTANCE_CONNECTION_NAME }}" \
            --update-env-vars="DATABASE_USER=${{ secrets.DATABASE_USER }},DATABASE_PASS=${{ secrets.DATABASE_PASS }},DATABASE_NAME=${{ secrets.DATABASE_NAME }},DATABASE_HOST=/cloudsql/${{ secrets.INSTANCE_CONNECTION_NAME }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},MAIL_USER=${{ secrets.MAIL_USER }},MAIL_PASS=${{ secrets.MAIL_PASS }},MAIL_HOST=smtp.gmail.com,MAIL_PORT=587,APP_URL=${{ vars.APP_URL }}" \
            --no-allow-unauthenticated \
            --quiet

  deploy-production:
    name: Deploy Production
    needs:
      - build-image
      - deploy-qa

    runs-on: ubuntu-latest
    environment: production

    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'production'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Production
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --add-cloudsql-instances="${{ secrets.INSTANCE_CONNECTION_NAME }}" \
            --update-env-vars="DATABASE_USER=${{ secrets.DATABASE_USER }},DATABASE_PASS=${{ secrets.DATABASE_PASS }},DATABASE_NAME=${{ secrets.DATABASE_NAME }},DATABASE_HOST=/cloudsql/${{ secrets.INSTANCE_CONNECTION_NAME }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},MAIL_USER=${{ secrets.MAIL_USER }},MAIL_PASS=${{ secrets.MAIL_PASS }},MAIL_HOST=smtp.gmail.com,MAIL_PORT=587,APP_URL=${{ vars.APP_URL }}" \
            --no-allow-unauthenticated \
            --quiet