name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - production

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  REPO_NAME: pastebin-repo
  IMAGE_NAME: pastebin-app
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate-manual-deployment:
    name: Validate manually selected commit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASS: pastebin_ci_password
      DATABASE_NAME: pastebin
      JWT_SECRET_KEY: pastebin-ci-jwt-secret
      ROLES_KEY: roles

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pastebin_ci_password
          POSTGRES_DB: pastebin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pastebin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build project
        run: npm run build

  build-image:
    name: Build and push Docker image
    needs: validate-manual-deployment
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.validate-manual-deployment.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            $REGION-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$COMMIT_SHA \
            .

      - name: Push Docker image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$COMMIT_SHA

  deploy-qa:
    name: Deploy QA
    needs: build-image
    runs-on: ubuntu-latest
    environment: qa

    if: >
      github.event_name == 'workflow_run' ||
      inputs.environment == 'qa' ||
      inputs.environment == 'production'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy QA
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$COMMIT_SHA" \
            --region="$REGION" \
            --add-cloudsql-instances="${{ secrets.INSTANCE_CONNECTION_NAME }}" \
            --update-env-vars="DATABASE_USER=${{ secrets.DATABASE_USER }},DATABASE_PASS=${{ secrets.DATABASE_PASS }},DATABASE_NAME=${{ secrets.DATABASE_NAME }},DATABASE_HOST=/cloudsql/${{ secrets.INSTANCE_CONNECTION_NAME }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},MAIL_USER=${{ secrets.MAIL_USER }},MAIL_PASS=${{ secrets.MAIL_PASS }},MAIL_HOST=smtp.gmail.com,MAIL_PORT=587,APP_URL=${{ vars.APP_URL }}" \
            --no-allow-unauthenticated \
            --quiet

  deploy-production:
    name: Deploy Production
    needs:
      - build-image
      - deploy-qa

    runs-on: ubuntu-latest
    environment: production

    if: >
      github.event_name == 'workflow_run' ||
      inputs.environment == 'production'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Production
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$COMMIT_SHA" \
            --region="$REGION" \
            --add-cloudsql-instances="${{ secrets.INSTANCE_CONNECTION_NAME }}" \
            --update-env-vars="DATABASE_USER=${{ secrets.DATABASE_USER }},DATABASE_PASS=${{ secrets.DATABASE_PASS }},DATABASE_NAME=${{ secrets.DATABASE_NAME }},DATABASE_HOST=/cloudsql/${{ secrets.INSTANCE_CONNECTION_NAME }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},MAIL_USER=${{ secrets.MAIL_USER }},MAIL_PASS=${{ secrets.MAIL_PASS }},MAIL_HOST=smtp.gmail.com,MAIL_PORT=587,APP_URL=${{ vars.APP_URL }}" \
            --no-allow-unauthenticated \
            --quiet
